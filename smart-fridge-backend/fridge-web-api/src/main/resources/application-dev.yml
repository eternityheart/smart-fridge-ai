# ====================================
# 智能冰箱菜谱系统 - 开发环境配置
# ====================================

spring:
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/smart_fridge?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: root
    password: hsp
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.smartfridge.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: smartfridge-jwt-secret-key-2026-must-be-longer-than-256-bits
  expiration: 86400  # 24小时

# DeepSeek API 配置
deepseek:
  api:
    key: sk-a14e811472d4472baa0e014f35042091
    base-url: https://api.deepseek.com/v1
    timeout: 30000
    max-tokens: 4096

# 视觉服务配置
vision:
  service:
    url: http://localhost:5000
    timeout: 30000

# MinIO 配置
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: fridge-images

# 日志配置
logging:
  level:
    com.smartfridge: DEBUG
    com.baomidou.mybatisplus: DEBUG
